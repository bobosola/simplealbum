# Example configuration for simplealbum.
#
# Copy this file to album.local.toml and edit it. The service has no default
# config path, so the file is named explicitly on every run:
#   SIMPLE_ALBUM_LOG=info \
#   SIMPLE_ALBUM_CONFIG=/path/to/album.local.toml \
#   ./target/release/album
#
# album.local.toml is gitignored so the live config — including the admin key —
# can never be committed by accident.
#
# Every setting below is required. The service never generates or rewrites this
# file, and it validates `album.root` and `admin.key` before starting.

# API bind address and port.
# Must match the reverse_proxy target in Caddyfile.local (localhost:18080).
[server]
bind = "127.0.0.1:18080"

# Externally visible base URL of this site, with a trailing slash. Used to build
# the absolute URLs that link-preview crawlers require (they never execute
# JavaScript and reject relative URLs). Must be the URL people actually share.
public_url = "https://localhost:8443/"

# Shown as og:site_name and as the title when sharing the album root.
site_name = "My Photo Album"

# Root of the photo tree. Must exist.
[album]
root = "/path/to/your/photos"

# SQLite database location. Parent directories are created if missing.
[state]
db_path = "/path/to/album.db"

# Thumbnail worker tuning.
# Concurrent thumbnail jobs. 0 = auto (CPU cores, clamped 2-8).
# Lower on small machines to reduce peak memory.
[worker]
threads = 0

# Shared secret for admin (cover image) operations. Must not be empty; the
# service never generates one, so replace this with your own secure value.
# Generate one with: openssl rand -base64 32
[admin]
key = "REPLACE-WITH-YOUR-OWN-KEY"
